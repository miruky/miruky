name: Generate Snake Animation

# 貢献グラフを蛇が食べるアニメSVGを生成し、output ブランチに公開します。
# 生成物: github-contribution-grid-snake.svg / -dark.svg  →  README から参照
on:
  # 毎日 00:00 UTC に自動更新
  schedule:
    - cron: "0 0 * * *"
  # 手動実行（初回はここから回すと output ブランチが作られます）
  workflow_dispatch:
  # main への push でも更新
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FF9900

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
