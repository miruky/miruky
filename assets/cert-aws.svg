    <stop offset="0" stop-color="#3B5BA5" stop-opacity="0.22"/><stop offset="1" stop-color="#3B5BA5" stop-opacity="0.06"/>
  </linearGradient>
  <linearGradient id="car" x1="0" y1="0" x2="1" y2="1">
