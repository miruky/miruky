  <rect x="24" y="30" width="48" height="48" rx="13" fill="#55C500" fill-opacity="0.12" stroke="#55C500" stroke-opacity="0.32" stroke-width="1"/>
  <g transform="translate(38,44)" fill="none" stroke="#9FE86B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17 L4 13 L14 3 L17 6 L7 16 Z"/><path d="M12.5 4.5 L15.5 7.5"/></g>
  <!-- text -->
  <text x="92" y="42" font-family="ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="9.5" letter-spacing="3" fill="#55C500" opacity="0.9">QIITA</text>
  <text x="92" y="63" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP','Meiryo',sans-serif" font-size="17" font-weight="700" fill="#E9F1FA">Qiita</text>
  <text x="92" y="85" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP','Meiryo',sans-serif" font-size="12" fill="#8A9BAB">AWS・AI・セキュリティ の技術記事 ・ 全10シリーズ</text>
