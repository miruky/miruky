  <linearGradient id="lqg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#55C500" stop-opacity="0.13"/><stop offset="1" stop-color="#55C500" stop-opacity="0.04"/>
  </linearGradient>
  <linearGradient id="lqr" x1="0" y1="0" x2="1" y2="1">
