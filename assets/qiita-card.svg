<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-label="Qiita 活動記録">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1826"/><stop offset="1" stop-color="#0A0E14"/>
    </linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A8ECFF"/><stop offset="1" stop-color="#5CD1F0"/>
    </linearGradient>
    <linearGradient id="feat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.55" stop-color="#A8ECFF"/><stop offset="1" stop-color="#5CD1F0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5CD1F0" stop-opacity="0.55"/><stop offset="0.5" stop-color="#5CD1F0" stop-opacity="0.10"/><stop offset="1" stop-color="#3AA0E0" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.26" cy="0.08" r="0.85">
      <stop offset="0" stop-color="#5CD1F0" stop-opacity="0.16"/><stop offset="1" stop-color="#5CD1F0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5CD1F0" stop-opacity="0.32"/><stop offset="1" stop-color="#5CD1F0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A8ECFF" stop-opacity="0"/><stop offset="0.5" stop-color="#A8ECFF" stop-opacity="0.12"/><stop offset="1" stop-color="#A8ECFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round"><rect x="2" y="2" width="856" height="396" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect x="2" y="2" width="856" height="396" fill="url(#panel)"/>
    <rect x="2" y="2" width="856" height="396" fill="url(#glow)"/>
    <rect x="2" y="2" width="856" height="150" fill="url(#glass)"/>
    <rect x="-380" y="2" width="380" height="396" fill="url(#sweep)">
      <animate attributeName="x" values="-380;860" dur="6.5s" begin="0s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1" keyTimes="0;1"/>
    </rect>
  </g>

  <!-- header -->
  <circle cx="38" cy="46" r="5" fill="#5CD1F0">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="5;6.5;5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="54" y="52" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#A8ECFF">Qiita</text>
  <text x="120" y="52" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP','Meiryo',sans-serif" font-size="14" letter-spacing="2" fill="#84A7BA">活動記録</text>
  <text x="822" y="51" text-anchor="end" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP','Meiryo',sans-serif" font-size="13" fill="#84A7BA">@miruky ・ 毎日更新</text>
  <line x1="40" y1="72" x2="820" y2="72" stroke="#5CD1F0" stroke-opacity="0.14" stroke-width="1"/>

  <!-- featured: contribution -->
  <text x="48" y="112" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP','Meiryo',sans-serif" font-size="14" letter-spacing="3" fill="#84A7BA">コントリビューション</text>
  <text x="46" y="180" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="62" font-weight="800" fill="url(#feat)">6,810</text>
  <g transform="translate(48,206)"><polygon points="0,10 5,1 10,10" fill="#5CD1F0"/><text x="16" y="10" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#A8ECFF">+1,338</text><text x="80" y="10" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP','Meiryo',sans-serif" font-size="12" fill="#84A7BA">直近30日</text></g>

