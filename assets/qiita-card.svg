<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="840" height="380" role="img" aria-label="Qiita stats">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1826"/><stop offset="1" stop-color="#0A0E14"/>
    </linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A8ECFF"/><stop offset="1" stop-color="#5CD1F0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5CD1F0" stop-opacity="0.55"/><stop offset="0.5" stop-color="#5CD1F0" stop-opacity="0.12"/><stop offset="1" stop-color="#3AA0E0" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#5CD1F0" stop-opacity="0.16"/><stop offset="1" stop-color="#5CD1F0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5CD1F0" stop-opacity="0.35"/><stop offset="1" stop-color="#5CD1F0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A8ECFF" stop-opacity="0"/><stop offset="0.5" stop-color="#A8ECFF" stop-opacity="0.14"/><stop offset="1" stop-color="#A8ECFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round"><rect x="2" y="2" width="836" height="376" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect x="2" y="2" width="836" height="376" fill="url(#panel)"/>
    <rect x="2" y="2" width="836" height="376" fill="url(#glow)"/>
    <rect x="2" y="2" width="836" height="140" fill="url(#glass)"/>
    <!-- glassy sweep -->
    <rect x="-360" y="2" width="360" height="376" fill="url(#sweep)">
      <animate attributeName="x" values="-360;840" dur="6s" begin="0s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1" keyTimes="0;1"/>
    </rect>
  </g>

  <!-- header -->
  <circle cx="34" cy="40" r="5" fill="#5CD1F0">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="5;6.5;5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="50" y="45" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="14" letter-spacing="5" fill="#A8ECFF">QIITA</text>
  <text x="806" y="45" text-anchor="end" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#84A7BA">@miruky &#183; updated daily</text>

  <text x="173" y="152" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="42" font-weight="800" fill="url(#num)">80</text><text x="173" y="176" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" letter-spacing="3" fill="#84A7BA">ARTICLES</text><text x="420" y="152" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="42" font-weight="800" fill="url(#num)">1,252</text><text x="420" y="176" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" letter-spacing="3" fill="#84A7BA">FOLLOWERS</text><text x="667" y="152" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="42" font-weight="800" fill="url(#num)">6,810</text><text x="667" y="176" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" letter-spacing="3" fill="#84A7BA">CONTRIBUTION</text><text x="173" y="232" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="42" font-weight="800" fill="url(#num)">4,464</text><text x="173" y="256" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" letter-spacing="3" fill="#84A7BA">LIKES</text><text x="420" y="232" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="42" font-weight="800" fill="url(#num)">4,531</text><text x="420" y="256" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" letter-spacing="3" fill="#84A7BA">STOCKS</text><text x="667" y="232" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="42" font-weight="800" fill="url(#num)">1.8M</text><text x="667" y="256" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" letter-spacing="3" fill="#84A7BA">VIEWS</text>

