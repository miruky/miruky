<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-label="Qiita 活動記録">
<defs>
  <radialGradient id="tray" cx="0.5" cy="0.28" r="0.9">
    <stop offset="0" stop-color="#0E1511"/><stop offset="1" stop-color="#0A0F0B"/>
  </radialGradient>
  <linearGradient id="heroGlass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#55C500" stop-opacity="0.18"/><stop offset="1" stop-color="#55C500" stop-opacity="0.05"/>
  </linearGradient>
  <linearGradient id="tileGlass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#55C500" stop-opacity="0.11"/><stop offset="1" stop-color="#55C500" stop-opacity="0.04"/>
  </linearGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#D8FFC2" stop-opacity="0.5"/><stop offset="0.5" stop-color="#55C500" stop-opacity="0.18"/><stop offset="1" stop-color="#0C2400" stop-opacity="0.10"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="heroNum" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#B9F58C"/><stop offset="1" stop-color="#7FE04A"/>
  </linearGradient>
  <linearGradient id="gaugeVal" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#55C500"/><stop offset="1" stop-color="#9AF05A"/>
  </linearGradient>
  <linearGradient id="barg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#55C500"/><stop offset="1" stop-color="#7FE04A"/>
  </linearGradient>
  <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#55C500" stop-opacity="0.30"/><stop offset="1" stop-color="#55C500" stop-opacity="0"/>
  </radialGradient>
  <filter id="drop" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0C2400" flood-opacity="0.42"/>
  </filter>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB">
    <feGaussianBlur stdDeviation="6"><animate attributeName="stdDeviation" values="5;8;5" dur="6s" repeatCount="indefinite"/></feGaussianBlur>
  </filter>
  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB">
    <feGaussianBlur stdDeviation="14"/>
  </filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" seed="7" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.77  0 0 0 0 0.10  0 0 0 0.05 0"/>
  </filter>
  <clipPath id="round"><rect x="2" y="2" width="856" height="396" rx="22"/></clipPath>
</defs>

<g clip-path="url(#round)">
  <rect x="2" y="2" width="856" height="396" fill="url(#tray)"/>
  <!-- light-leak orbs behind hero -->
  <circle cx="150" cy="170" r="140" fill="url(#orb)" filter="url(#soft)"/>
  <circle cx="300" cy="300" r="110" fill="url(#orb)" filter="url(#soft)" opacity="0.7"/>
  <!-- glass sweep -->
  <rect x="-380" y="2" width="300" height="396" fill="#FFFFFF" opacity="0.05">
    <animate attributeName="x" values="-380;860" dur="7s" begin="1.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1" keyTimes="0;1"/>
  </rect>
</g>

<!-- header -->
<circle cx="38" cy="46" r="5" fill="#55C500">
  <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
  <animate attributeName="r" values="5;6.4;5" dur="2.4s" repeatCount="indefinite"/>
</circle>
<text x="54" y="52" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic','Noto Sans JP',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#C2F0C2">Qiita</text>
<text x="120" y="52" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP','Meiryo',sans-serif" font-size="14" letter-spacing="2" fill="#71D083">活動記録</text>
<text x="822" y="51" text-anchor="end" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP','Meiryo',sans-serif" font-size="13" fill="#71D083">@miruky ・ 毎日更新</text>
<line x1="40" y1="72" x2="820" y2="72" stroke="#55C500" stroke-opacity="0.16" stroke-width="1"/>

<!-- ===== HERO: VIEWS gauge ===== -->
<g filter="url(#drop)"><rect x="28" y="88" width="372" height="284" rx="18" fill="url(#heroGlass)"/><rect x="28" y="88" width="372" height="284" rx="18" fill="none" stroke="url(#rim)" stroke-width="1.2"/><rect x="29" y="89" width="370" height="114" rx="16" fill="url(#sheen)"/></g>
<g>
  <path d="M140.46 281.54 A104 104 0 1 1 287.54 281.54" fill="none" stroke="#55C500" stroke-opacity="0.15" stroke-width="14" stroke-linecap="round"/>
  <path d="M140.46 281.54 A104 104 0 1 1 287.54 281.54" fill="none" stroke="url(#gaugeVal)" stroke-width="14" stroke-linecap="round" pathLength="100"
        stroke-dasharray="90.4 100" filter="url(#glow)" opacity="0.55"/>
  <path d="M140.46 281.54 A104 104 0 1 1 287.54 281.54" fill="none" stroke="url(#gaugeVal)" stroke-width="14" stroke-linecap="round" pathLength="100"
        stroke-dasharray="90.4 100" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" values="90.4;0" dur="1.3s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1"/>
  </path>
  <g transform="translate(206,138)" fill="none" stroke="#71D083" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M0 6 C3 1 11 1 14 6 C11 11 3 11 0 6 Z"/><circle cx="7" cy="6" r="2.2" fill="#71D083" stroke="none"/></g>
  <text x="214" y="178" text-anchor="middle" font-family="ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="12" letter-spacing="4" fill="#8FBF8A">VIEWS</text>
  <text x="214" y="220" text-anchor="middle" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic','Noto Sans JP',Helvetica,Arial,sans-serif" font-size="40" font-weight="800" fill="url(#heroNum)">1,807,555</text>
  <text x="214" y="248" text-anchor="middle" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP','Meiryo',sans-serif" font-size="14" fill="#8FBF8A">閲覧数</text>
  <text x="214" y="304" text-anchor="middle" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP','Meiryo',sans-serif" font-size="11" fill="#71D083">目標 2.0M まで 90%</text>
</g>

<!-- ===== support tiles ===== -->
<g filter="url(#drop)"><rect x="416" y="88" width="200" height="134" rx="16" fill="url(#tileGlass)"/><rect x="416" y="88" width="200" height="134" rx="16" fill="none" stroke="url(#rim)" stroke-width="1.2"/><rect x="417" y="89" width="198" height="54" rx="14" fill="url(#sheen)"/></g>
