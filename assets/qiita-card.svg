  <path d="M8 13 l4 -6 l4 6 Z" fill="#7FE04A"/>
  <text x="22" y="14" font-family="ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#7FE04A">+1,332</text>
</g>
