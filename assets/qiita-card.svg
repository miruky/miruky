    <animate attributeName="opacity" values="1;0.4;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- glass border on top -->
  <rect x="2" y="2" width="836" height="376" rx="20" fill="none" stroke="url(#border)" stroke-width="1.5"/>
