<text x="432" y="204" font-family="ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="10" letter-spacing="1.2" fill="#8FBF8A">CONTRIBUTION <tspan font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP','Meiryo',sans-serif" letter-spacing="0">・ 直近30日</tspan></text>

